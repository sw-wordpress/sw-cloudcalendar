name: Tests and SonarQube
on:
  push:
    branches:
    - '**'
  pull_request: null
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    env:
      XDEBUG_MODE: coverage
      SWC_TEST_DB_HOST: 127.0.0.1
      SWC_TEST_DB_PORT: '33078'
      SWC_TEST_DB_USER: root
      SWC_TEST_DB_PASSWORD: wordpress-test
    steps:
    - uses: actions/checkout@v7
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mysqli, pdo_mysql, mbstring, sodium, zip, gd
        tools: composer:v2
        coverage: xdebug
    - run: composer install --prefer-dist --no-interaction --no-progress
    - run: composer validate --strict
    - name: Audit shipped Composer packages
      run: composer audit --locked --no-dev
    - run: composer cs && composer cs:wp && composer stan
    - name: Install isolated WordPress test dependencies
      run: composer install --working-dir=tests/wp --prefer-dist --no-interaction --no-progress
    - name: Unit and integration coverage
      run: |-
        mkdir -p coverage
        vendor/bin/phpunit --testsuite unit,integration --coverage-clover coverage/unit.xml
    - name: WordPress coverage
      working-directory: tests/wp
      run: vendor/bin/phpunit -c phpunit.xml.dist --coverage-clover ../../coverage/wordpress.xml
    - name: Test performance report formatter
      run: node --test tests/Performance/comment.test.cjs
    - name: Local performance benchmark (2000 events)
      env:
        SWC_PERF_REPORT: ${{ runner.temp }}/swc-performance.json
      run: composer test:performance
    - name: Performance job summary
      uses: actions/github-script@v8
      with:
        script: |
          await require('./.github/scripts/performance-comment.cjs').run(
            { github, context, core }, `${process.env.RUNNER_TEMP}/swc-performance.json`
          );
    - name: Upload performance measurements
      uses: actions/upload-artifact@v7
      with:
        name: calendar-performance
        path: ${{ runner.temp }}/swc-performance.json
        if-no-files-found: error
        retention-days: 14
    - name: Merge and normalize Clover paths
      run: php tests/coverage/merge.php coverage/unit.xml coverage/wordpress.xml
    - name: Upload Clover coverage
      uses: actions/upload-artifact@v7
      with:
        name: php-coverage
        path: coverage/clover.xml
        if-no-files-found: error
        retention-days: 14
    - name: Strict PHP line coverage gate (> 80 %)
      run: php tests/coverage/check.php coverage/clover.xml
    - uses: actions/setup-node@v7
      with:
        node-version-file: apps/admin/.nvmrc
        cache: npm
        cache-dependency-path: |
          apps/admin/package-lock.json
          tests/E2E/package-lock.json
    - name: Build admin assets for browser tests
      run: npm ci --prefix apps/admin && npm run build --prefix apps/admin
    - name: Install browser test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y mariadb-client
        npm ci --prefix tests/E2E
        cd tests/E2E && npx playwright-core install --with-deps chromium
    - name: Browser E2E
      run: tests/E2E/run.sh "$RUNNER_TEMP/swc-e2e"
    - name: Upload browser test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: browser-e2e
        path: |
          ${{ runner.temp }}/swc-e2e/result.txt
          ${{ runner.temp }}/swc-e2e/server.log
          ${{ runner.temp }}/swc-e2e/shots
          ${{ runner.temp }}/swc-e2e/wp/debug.log
        if-no-files-found: ignore
        retention-days: 14
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: wordpress-test
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: swc_wp_tests
        ports:
        - 33078:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
  performance-comment:
    name: Performance PR comment
    needs: php
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: performance-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: .github/scripts
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        name: calendar-performance
        path: performance
    - uses: actions/github-script@v8
      with:
        script: |
          await require('./.github/scripts/performance-comment.cjs').run(
            { github, context, core }, 'performance/swc-performance.json', true
          );
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: apps/admin/.nvmrc
        cache: npm
        cache-dependency-path: apps/admin/package-lock.json
    - run: npm ci
    - name: Audit npm packages including dev tooling
      run: npm audit --audit-level=high
    - run: npm run lint && npm run typecheck
    - name: Tests with strict JS/TS line coverage gate (> 80 %)
      run: npm run test:coverage
    - run: npm run build
    - name: Upload frontend LCOV coverage
      uses: actions/upload-artifact@v7
      with:
        name: frontend-coverage
        path: apps/admin/coverage/lcov.info
        if-no-files-found: error
        retention-days: 14
  sonarqube:
    name: SonarQube Cloud
    needs:
    - php
    - frontend
    if: |-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'push' &&
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v8
      with:
        name: php-coverage
        path: coverage
    - uses: actions/download-artifact@v8
      with:
        name: frontend-coverage
        path: coverage/frontend
    - name: Check SonarQube configuration
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      run: |
        if [ -z "$SONAR_TOKEN" ]; then
          echo '::error::Set the SONAR_TOKEN repository secret before running SonarQube analysis.'
          exit 1
        fi
        if [ -z "$SONAR_ORGANIZATION" ]; then
          echo '::error::Set the SONAR_ORGANIZATION repository variable to your SonarQube Cloud organization key.'
          exit 1
        fi
        test -s coverage/clover.xml
        test -s coverage/frontend/lcov.info
    - name: Analyze code and import coverage
      uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
      with:
        args: -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
