<article class="swc-card">
  {{#event.image}}<img class="swc-card__image" src="{{event.image}}" alt="" loading="lazy">{{/event.image}}
  <div class="swc-card__body">
    <p class="swc-card__date" style="color: {{event.color}}"><time datetime="{{event.start_iso}}">{{event.date_range}}</time></p>
    <h3 class="swc-card__title"><a href="{{event.detail_url}}" data-swc-detail="">{{event.title}}</a></h3>
    {{#event.location}}<p class="swc-card__location">{{event.location}}</p>{{/event.location}}
    {{#event.excerpt}}<p class="swc-card__excerpt">{{event.excerpt}}</p>{{/event.excerpt}}
  </div>
</article>
