<article class="swc-badge-row">
  <div class="swc-badge-row__badge">
    <span class="swc-badge-row__day">{{event.day}}</span>
    <span class="swc-badge-row__month">{{event.month_short}} {{event.year_short}}</span>
  </div>
  <div class="swc-badge-row__card">
    <h3 class="swc-badge-row__title"><a href="{{event.detail_url}}" data-swc-detail="">{{event.title}}</a></h3>
    <p class="swc-badge-row__meta swc-badge-row__when"><span class="swc-badge-row__icon swc-badge-row__icon--time" aria-hidden="true"></span><time datetime="{{event.start_iso}}">{{event.date_range}}</time></p>
    {{#event.location}}<p class="swc-badge-row__meta swc-badge-row__where"><span class="swc-badge-row__icon swc-badge-row__icon--place" aria-hidden="true"></span><span>{{event.location}}</span></p>{{/event.location}}
  </div>
</article>
